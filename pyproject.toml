[project]
name = "tech-challenge-churn"
version = "0.1.0"
description = "Rede neural MLP com pipeline end-to-end para previsao de churn em telecom."
readme = "README.md"
requires-python = ">=3.14.4,<3.15"
# So o que a API precisa para servir o modelo. E isso que vai para a imagem Docker.
dependencies = [
    "fastapi>=0.115.0",
    "joblib>=1.4.2",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.0",
    "scikit-learn>=1.7.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
# Treino, tracking e dados. Pesado (o torch sozinho passa de 3 GB no Linux) e a API
# nao usa nada disso, por isso fica fora da imagem.
train = [
    "kagglehub>=1.0.0",
    "mlflow>=2.20.0",
    "pandera>=0.26.0",
    "torch>=2.10.0",
]
# Para abrir e executar os notebooks de EDA.
notebook = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "nbconvert>=7.16.0",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
churn-download-data = "churn.download_data:main"
churn-generate-sample = "churn.data:main_generate_sample"
churn-compare-models = "churn.compare_models:main"
churn-train-baseline = "churn.baseline:main"
churn-train-mlp = "churn.train:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.uv]
# uv sync e uv run instalam treino, notebook e dev por padrao, entao nada muda no dia a dia.
default-groups = ["dev", "train", "notebook"]
# Por padrao o uv so reinstala o pacote quando o pyproject.toml muda. Como os
# comandos rodam com --no-editable, mudancas em src/ ficavam de fora sem isso.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "LOG"]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Gerado a partir do .ipynb (make notebook). Expressao solta como df.head() e o jeito de
# mostrar tabela no notebook, e as linhas longas vem das tabelas em markdown.
"notebooks/*.py" = ["B018", "E402", "E501", "UP009"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
